<!doctype html>
<html lang="en-us">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Timer de contagem regressiva estilo japonês, com 1 a 3 timers simultâneos.">
    <meta property="og:title" content="Multi Timer — Japanese Style">
    <meta property="og:description" content="Timer de contagem regressiva estilo japonês, com 1 a 3 timers simultâneos.">
    <meta property="og:type" content="website">
    <title>Multi Timer — Japanese Style</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='6' width='28' height='20' rx='4' fill='%234d614d'/%3E%3Ctext x='16' y='21' font-family='monospace' font-size='11' fill='%23eef2e8' text-anchor='middle'%3E88%3C/text%3E%3C/svg%3E">
    <style>
      html, body { margin: 0; padding: 0; background: #e6e6e0; height: 100%; }
      #canvas { display: block; margin: 0 auto; }
      #load-error { display: none; max-width: 60ch; margin: 24px auto; padding: 16px 20px;
        font-family: system-ui, sans-serif; color: #b3261e; background: #fff;
        border-radius: 8px; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="canvas" role="img" aria-label="Multi Timer estilo japonês: até 3 timers de contagem regressiva"></canvas>
    <div id="spinner" class="pending"></div>
    <noscript><div style="text-align:center;font-family:system-ui">This timer needs JavaScript enabled.</div></noscript>
    <div id="load-error" role="alert"></div>
    <script>
      // Friendly error if the love.js runtime or game data fails to load.
      // Note: sound starts after your first click/keypress (browser autoplay policy).
      window.addEventListener("error", function (e) {
        var el = document.getElementById("load-error");
        if (el && !window.__timerBooted) {
          el.style.display = "block";
          el.textContent = "Could not load the timer (" +
            ((e && e.message) || "runtime or game data missing") +
            "). Check your connection and reload.";
        }
      }, true);
    </script>
    <script src="player.js?g=game.love&v=11.5"></script>
  </body>
</html>
