<!DOCTYPE html>
<!-- RASCUNHO — container web ALTERNATIVO, NÃO publicado.
     O site no ar (timenoodles.github.io/timer, branch gh-pages) usa outro
     harness incompatível (2dengine/love.js: player.js + index.html +
     style.css próprios, API Player.start). Este arquivo usa o harness
     Davidobot/love.js (API love.run) e NÃO tem ligação com o publicado:
     editar aqui não muda nada no site. Mantido como referência porque o
     botão "Iniciar" dele resolve o desbloqueio de áudio por gesto do
     usuário — motivo para uma eventual migração futura (que exigiria
     gerar o bundle certo e trocar o gh-pages inteiro, não só este file).
     Fluxo real de publicação: ver README ("Web/publicação").
     (Notas antigas de conversão Davidobot mantidas abaixo p/ referência.) -->
<!-- Conversão Davidobot/love.js (https://github.com/Davidobot/love.js):
        1. Gere timer-japones.love (zip do jogo, ver README).
        2. Converta com love.js: o bundle gera love.js + game data.
        3. Coloque este index.html + o bundle no mesmo diretório
           e ajuste GAME_FILE abaixo. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="Timer de contagem regressiva estilo japonês, com 1 a 3 timers simultâneos.">
<meta property="og:title" content="Multi Timer — Japanese Style">
<meta property="og:description" content="Timer de contagem regressiva estilo japonês, com 1 a 3 timers simultâneos.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://timenoodles.github.io/timer/og-image.png">
<title>Multi Timer — Japanese Style</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='6' width='28' height='20' rx='4' fill='%234d614d'/%3E%3Ctext x='16' y='21' font-family='monospace' font-size='11' fill='%23eef2e8' text-anchor='middle'%3E88%3C/text%3E%3C/svg%3E">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #e6e6e1; }
  body { display: flex; align-items: center; justify-content: center;
         font-family: system-ui, sans-serif; }
  #wrap { position: relative; width: min(96vw, 900px); }
  canvas { width: 100%; display: block; border-radius: 12px;
           background: #4d614d; image-rendering: -webkit-optimize-contrast; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
             align-items: center; justify-content: center; gap: 12px;
             color: #595b54; text-align: center; padding: 24px; }
  #overlay[hidden] { display: none; }
  #start { font-size: 18px; padding: 12px 28px; border: 0; border-radius: 10px;
           background: #8cc68c; cursor: pointer; }
  #start:active { transform: translateY(2px); }
  #err { color: #b3261e; max-width: 60ch; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas" width="900" height="700" role="img" aria-label="Multi Timer estilo japonês: até 3 timers de contagem regressiva"></canvas>
  <div id="live" aria-live="polite" aria-atomic="true" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;"></div>
  <noscript><div style="text-align:center;font-family:system-ui,sans-serif;padding:16px">Este timer precisa de JavaScript habilitado para funcionar.</div></noscript>
  <div id="overlay">
    <div id="status">Carregando timer…</div>
    <button id="start" hidden>Iniciar</button>
    <div id="err"></div>
  </div>
</div>
<script>
  // Ajuste conforme o bundle love.js gerado.
  var GAME_FILE = "timer-japones.love";
  var overlay = document.getElementById("overlay");
  var statusEl = document.getElementById("status");
  var startBtn = document.getElementById("start");
  var errEl = document.getElementById("err");

  function fail(msg) {
    statusEl.textContent = "Não foi possível carregar o timer.";
    errEl.textContent = msg;
    startBtn.hidden = true;
  }

  // HiDPI: ajusta backing store do canvas ao devicePixelRatio antes de iniciar
  function fixCanvasDPR() {
    var canvas = document.getElementById("canvas");
    var dpr = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    // Mantém CSS em 100% (via #wrap), mas buffer em DPR para nitidez Retina
    // O harness love.js respeita width/height do canvas como framebuffer.
    if (rect.width > 0) {
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
    }
  }

  // love.js expõe `love` global após carregar love.js; o jogo inicia no
  // primeiro gesto do usuário (necessário p/ desbloquear áudio no navegador).
  function boot() {
    if (typeof love === "undefined") {
      fail("love.js não encontrado. Gere o bundle web a partir do .love.");
      return;
    }
    fixCanvasDPR();
    statusEl.textContent = "Pronto.";
    startBtn.hidden = false;
    startBtn.addEventListener("click", function () {
      overlay.hidden = true;
      fixCanvasDPR();
      try { love.run(GAME_FILE, "#canvas"); }
      catch (e) { overlay.hidden = false; fail(String(e)); }
    }, { once: true });
  }

  // Acessibilidade: observa mudança de título (⏰ TEMPO!) e anuncia em aria-live
  (function(){
    var live = document.getElementById("live");
    var lastTitle = document.title;
    setInterval(function(){
      if (document.title !== lastTitle) {
        lastTitle = document.title;
        if (lastTitle.indexOf("TEMPO") !== -1 && live) {
          live.textContent = "Timer finalizado: " + lastTitle;
        }
      }
      // Também detecta fixCanvasDPR em resize
      if (window.devicePixelRatio) fixCanvasDPR();
    }, 500);
  })();

  window.addEventListener("load", boot);
  // Some com o overlay automaticamente se o jogo já estiver rodando
  // (alguns bundles iniciam sozinhos).
  setTimeout(function () {
    if (window.__timerRunning) overlay.hidden = true;
  }, 5000);
</script>
</body>
</html>
